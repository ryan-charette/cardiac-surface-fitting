[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiac-geometry-kernels"
version = "0.1.0"
description = "Reference and GPU-ready kernels for cardiac T-spline surface evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]
torch = ["torch>=2.4"]
triton = ["triton>=3.0"]

[project.scripts]
cardiac-kernels = "cardiac_geometry.cli:main"

[tool.setuptools.packages.find]
include = ["cardiac_geometry*", "triton_kernels*"]
